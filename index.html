<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videótár</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        /* =========================
           JELSZÓS OLDAL
        ========================= */

        #login {
            position: fixed;
            inset: 0;
            background: #0f0f0f;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .login-box {
            width: 90%;
            max-width: 400px;

            background: #181818;

            padding: 35px;

            border-radius: 15px;

            text-align: center;
        }

        .login-box h1 {
            margin-top: 0;
        }

        .login-box input {
            width: 100%;

            padding: 14px;

            margin-top: 15px;
            margin-bottom: 12px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
        }

        .login-box button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #ff0000;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-box button:hover {
            background: #cc0000;
        }

        #hiba {
            display: none;
            color: #ff4444;
        }


        /* =========================
           WEBOLDAL
        ========================= */

        #website {
            display: none;
        }

        header {
            height: 60px;

            background: #181818;

            display: flex;
            align-items: center;

            padding: 0 25px;

            border-bottom: 1px solid #303030;
        }

        header h2 {
            margin: 0;
            font-size: 22px;
        }


        /* =========================
           VIDEÓK
        ========================= */

        .videos {
            padding: 30px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));

            gap: 25px;
        }

        .video-card {
            cursor: pointer;
        }

        .thumbnail {
            width: 100%;

            aspect-ratio: 16 / 9;

            background: #222;

            border-radius: 10px;

            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.2s;
        }

        .video-card:hover .thumbnail img {
            transform: scale(1.03);
        }

        .video-title {
            font-size: 16px;

            margin-top: 10px;

            font-weight: bold;
        }


        /* =========================
           NAGY VIDEÓ
        ========================= */

        #videoPlayer {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.96);

            z-index: 2000;

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        #youtubeVideo {
            width: 90vw;
            height: 80vh;

            max-width: 1400px;

            border: none;
            border-radius: 10px;
        }

        #closeButton {
            position: absolute;

            top: 15px;
            right: 25px;

            font-size: 35px;

            color: white;

            background: none;

            border: none;

            cursor: pointer;

            z-index: 2100;
        }


        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 600px) {

            .videos {
                padding: 15px;

                grid-template-columns: 1fr;
            }

            #youtubeVideo {
                width: 100%;
                height: 60vh;
            }

        }
    </style>
</head>


<body>


    <!-- =========================
         JELSZÓ
    ========================= -->

    <div id="login">

        <div class="login-box">

            <h1>🔒 Videótár</h1>

            <p>
                Az oldal megtekintéséhez add meg a jelszót.
            </p>

            <input
                type="password"
                id="password"
                placeholder="Jelszó"
                onkeydown="enter(event)"
            >

            <button onclick="checkPassword()">
                Belépés
            </button>

            <p id="hiba">
                Hibás jelszó!
            </p>

        </div>

    </div>



    <!-- =========================
         WEBOLDAL
    ========================= -->

    <div id="website">

        <header>

            <h2>
                🎬 Videótár
            </h2>

        </header>


        <main class="videos">


            <!-- =========================
                 VIDEÓ 1
            ========================= -->

            <div
                class="video-card"
                onclick="openVideo('ylYqRy6OTWI')"
            >

                <div class="thumbnail">

                    <img
                        src="https://img.youtube.com/vi/ylYqRy6OTWI/maxresdefault.jpg"
                        alt="Az első videóm"
                    >

                </div>

                <div class="video-title">
                    Az első videóm
                </div>

            </div>



            <!-- =========================
                 IDE JÖHETNEK KÉSŐBB
                 AZ ÚJ VIDEÓK
            ========================= -->

            <!--

            <div
                class="video-card"
                onclick="openVideo('YOUTUBE_ID')"
            >

                <div class="thumbnail">

                    <img
                        src="https://img.youtube.com/vi/YOUTUBE_ID/maxresdefault.jpg"
                        alt="Második videó"
                    >

                </div>

                <div class="video-title">
                    Második videó
                </div>

            </div>

            -->


        </main>

    </div>



    <!-- =========================
         VIDEÓLEJÁTSZÓ
    ========================= -->

    <div id="videoPlayer">

        <button
            id="closeButton"
            onclick="closeVideo()"
        >
            ✕
        </button>


        <iframe
            id="youtubeVideo"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>



    <script>

        /* =========================
           JELSZÓ
        ========================= */

        function checkPassword() {

            const password =
                document.getElementById("password").value;


            if (password === "alma") {

                document.getElementById("login").style.display =
                    "none";

                document.getElementById("website").style.display =
                    "block";

            } else {

                document.getElementById("hiba").style.display =
                    "block";

            }

        }


        /* ENTER BILLENTYŰ */

        function enter(event) {

            if (event.key === "Enter") {

                checkPassword();

            }

        }



        /* =========================
           VIDEÓ MEGNYITÁSA
        ========================= */

        function openVideo(videoId) {

            const player =
                document.getElementById("videoPlayer");

            const youtube =
                document.getElementById("youtubeVideo");


            youtube.src =
                "https://www.youtube.com/embed/"
                + videoId
                + "?autoplay=1";


            player.style.display = "flex";

        }



        /* =========================
           VIDEÓ BEZÁRÁSA
        ========================= */

        function closeVideo() {

            const player =
                document.getElementById("videoPlayer");

            const youtube =
                document.getElementById("youtubeVideo");


            youtube.src = "";

            player.style.display = "none";

        }

    </script>


</body>
</html>
